<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
 
<title>NiimbotWebPrint v0.0.2 Diagnostic Edition</title>
 
<script src.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.jsscript>
 
<style>
body{
font-family:Arial,sans-serif;
margin:15px;
background:#f5f5f5;
}
 
.card{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:15px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}
 
input{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:10px;
box-sizing:border-box;
}
 
button{
padding:10px 15px;
margin:5px;
cursor:pointer;
}
 
.label{
width:320px;
margin:auto;
border:1px solid #ddd;
background:white;
padding:10px;
}
 
.number{
text-align:center;
font-weight:bold;
font-size:18px;
}
 
.name{
text-align:center;
margin-top:8px;
}
 
#log{
background:#111;
color:#00ff00;
font-family:monospace;
padding:10px;
min-height:250px;
overflow:auto;
white-space:pre-wrap;
}
 
.success{
color:green;
font-weight:bold;
}
 
.error{
color:red;
font-weight:bold;
}
</style>
</head>
 
<body>
 
<h1>NiimbotWebPrint v0.0.2</h1>
<p>Diagnostic Edition</p>
 
<div class="card">
 
<h3>Süsteemiinfo</h3>
 
<div id="sysinfo"></div>
 
</div>
 
<div class="card">
 
<label>Artikli number</label>
<input id="articleNo" value="123456789">
 
<label>Artikli nimetus</label>
<input id="articleName" value="Testtoode">
 
<button onclick="generateLabel()">
Loo etikett
</button>
 
<button onclick="connectPrinter()">
Ühenda printer
</button>
 
<button onclick="readServices()">
Diagnoosi printer
</button>
 
<div id="status">
Printer ühendamata
</div>
 
</div>
 
<div class="card">
 
<h3>Etiketi eelvaade</h3>
 
<div class="label">
 
<div id="previewNumber" class="number">
123456789
</div>
 
<svg id="barcode"></svg>
 
<div id="previewName" class="name">
Testtoode
</div>
 
</div>
 
</div>
 
<div class="card">
 
<h3>Diagnostika logi</h3>
 
<div id="log"></div>
 
</div>
 
<script>
 
let device = null;
let server = null;
 
function log(text){
 
const ts =
new Date().toLocaleTimeString();
 
document.getElementById("log").innerHTML +=
"[" + ts + "] " + text + "\\n";
 
console.log(text);
}
 
function showSystemInfo(){
 
let html = "";
 
html += "<b>Browser:</b> " +
navigator.userAgent + "<br>";
 
html += "<b>WebBluetooth:</b> " +
(navigator.bluetooth ? "YES" : "NO") +
"<br>";
 
html += "<b>Secure Context:</b> " +
(window.isSecureContext ? "YES" : "NO") +
"<br>";
 
html += "<b>JsBarcode:</b> " +
(typeof JsBarcode !== "undefined"
? "<span class='success'>Loaded</span>"
: "<span class='error'>Failed</span>")
+ "<br>";
 
document.getElementById("sysinfo").innerHTML =
html;
 
}
 
function generateLabel(){
 
try{
 
const no =
document.getElementById("articleNo").value;
 
const name =
document.getElementById("articleName").value;
 
document.getElementById("previewNumber")
.innerText = no;
 
document.getElementById("previewName")
.innerText = name;
 
JsBarcode(
"#barcode",
no,
{
format:"CODE128",
width:2,
height:80,
displayValue:false
}
);
 
log("Barcode generated OK");
 
}catch(ex){
 
log("Barcode ERROR: " + ex.message);
 
}
 
}
 
async function connectPrinter(){
 
try{
 
log("Opening Bluetooth selector");
 
device =
await navigator.bluetooth.requestDevice({
 
acceptAllDevices:true,
optionalServices:[
0x1800,
0x1801,
0x180A,
0x180F
]
 
});
 
log("Device selected: " +
(device.name || "Unknown"));
 
document.getElementById("status")
.innerText =
"Valitud: " +
(device.name || "Unknown");
 
log("Connecting GATT...");
 
server =
await device.gatt.connect();
 
log("GATT CONNECTED");
 
document.getElementById("status")
.innerText =
"GATT ühendatud";
 
}
 
catch(ex){
 
log("ERROR: " + ex.message);
 
}
 
}
 
async function readServices(){
 
try{
 
if(!server){
 
log("Printer not connected");
 
return;
}
 
const services =
await server.getPrimaryServices();
 
log(
"Services found: " +
services.length
);
 
for(const service of services){
 
log(
"SERVICE: " +
service.uuid
);
 
const characteristics =
await service.getCharacteristics();
 
for(const c of characteristics){
 
let props = [];
 
for(let p in c.properties){
 
if(c.properties[p])
props.push(p);
 
}
 
log(
" CHAR: " +
c.uuid
);
 
log(
" PROPS: " +
props.join(", ")
);
 
}
 
}
 
}
 
catch(ex){
 
log(
"SERVICE READ ERROR: " +
ex.message
);
 
}
 
}
 
showSystemInfo();
generateLabel();
 
</script>
 
</body>
</html>
